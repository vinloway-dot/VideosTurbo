name: Apply six clip main regression fix

on:
  pull_request:
    paths:
      - .github/workflows/apply-six-clip-main-regression-fix.yml
      - webui/Main.py
      - test/services/test_webui_loomloom.py

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-test-push:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/six-clip-media-timeline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/six-clip-media-timeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Apply exact fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              source = file_path.read_text(encoding="utf-8")
              if new in source:
                  return
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch target, found {count}")
              file_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "webui/Main.py",
              '                value=int(config.ui.get("target_words", 130) or 130),\n',
              '                value=_saved_ui_number("target_words", 130, 40, 400, int),\n',
          )
          replace_once(
              "test/services/test_webui_loomloom.py",
              'def _has_widget(elements, key):\n    return any(str(getattr(item, "key", "")) == key for item in elements)\n',
              'def _has_widget(elements, key):\n    return any(\n        str(getattr(item, "key", "")) == key\n        or str(getattr(item, "key", "")).startswith(f"{key}_")\n        for item in elements\n    )\n',
          )
      - run: uv sync --frozen --python 3.11
      - name: Verify focused regressions
        run: >-
          uv run --no-sync pytest -q
          test/services/test_webui_generation_defaults.py
          test/services/test_webui_loomloom.py
          test/services/test_six_clip_webui.py
      - name: Compile and lint
        run: |
          uv run --no-sync python -m py_compile webui/Main.py test/services/test_webui_loomloom.py test/services/test_webui_generation_defaults.py
          uv run --no-sync ruff check webui/Main.py test/services/test_webui_loomloom.py test/services/test_webui_generation_defaults.py
          git diff --check
      - name: Commit fixes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/Main.py test/services/test_webui_loomloom.py
          git commit -m "fix: normalize six clip main saved settings"
          git push origin HEAD:feature/six-clip-media-timeline
