name: Six clip review TDD

on:
  pull_request:
    paths:
      - app/services/six_clip_media.py
      - webui/six_clip_timeline.py
      - test/services/test_six_clip_media.py
      - test/services/test_six_clip_webui.py
      - .github/workflows/six-clip-review-tdd.yml

jobs:
  focused-review-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.11
      - run: >-
          uv run --no-sync pytest -q
          test/services/test_six_clip_media.py
          test/services/test_six_clip_webui.py
