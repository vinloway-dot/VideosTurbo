name: Patch Gemini 3.1 TTS

on:
  push:
    branches:
      - ui/six-clip-compact-sections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/six-clip-compact-sections

      - name: Repair Gemini TTS indentation
        shell: python
        run: |
          from pathlib import Path
          import re

          voice_path = Path("app/services/voice.py")
          voice_text = voice_path.read_text(encoding="utf-8")
          voice_pattern = re.compile(
              r'(?ms)^        model = str\(\n.*?^        generation_config = types\.GenerateContentConfig\('
          )
          voice_replacement = "\n".join([
              "        model = str(",
              "            config.app.get(\"gemini_tts_model\", GEMINI_TTS_DEFAULT_MODEL)",
              "            or GEMINI_TTS_DEFAULT_MODEL",
              "        ).strip()",
              "        logger.info(",
              "            f\"start Gemini TTS, model: {model}, voice name: {voice_name}, try: 1\"",
              "        )",
              "",
              "        generation_config = types.GenerateContentConfig(",
          ])
          voice_text, voice_count = voice_pattern.subn(voice_replacement, voice_text, count=1)
          if voice_count != 1:
              raise SystemExit(f"Gemini TTS body repair count: {voice_count}")
          voice_path.write_text(voice_text, encoding="utf-8")

          main_path = Path("webui/Main.py")
          main_text = main_path.read_text(encoding="utf-8")

          signature_pattern = re.compile(
              r'(?ms)^    if tts_server == "gemini-tts":\n'
              r'        return \{\n'
              r'.*?'
              r'^        \}\n'
              r'(?=    if tts_server == "mimo-tts":)'
          )
          signature_replacement = "\n".join([
              '    if tts_server == "gemini-tts":',
              '        return {',
              '            "model_id": config.app.get(',
              '                "gemini_tts_model", voice.GEMINI_TTS_DEFAULT_MODEL',
              '            ),',
              '            "credential": _credential_signature(config.app.get("gemini_api_key", "")),',
              '        }',
          ]) + "\n"
          main_text, signature_count = signature_pattern.subn(
              signature_replacement, main_text, count=1
          )
          if signature_count != 1:
              raise SystemExit(f"Gemini preview signature repair count: {signature_count}")

          selector_pattern = re.compile(
              r'(?ms)^    saved_gemini_tts_model = str\(\n.*?'
              r'^    _set_runtime_config\("app", "gemini_tts_model", gemini_tts_model\)\n'
          )
          selector_replacement = "\n".join([
              '                saved_gemini_tts_model = str(',
              '                    config.app.get(',
              '                        "gemini_tts_model", voice.GEMINI_TTS_DEFAULT_MODEL',
              '                    )',
              '                    or voice.GEMINI_TTS_DEFAULT_MODEL',
              '                ).strip()',
              '                if saved_gemini_tts_model not in voice.GEMINI_TTS_MODELS:',
              '                    saved_gemini_tts_model = voice.GEMINI_TTS_DEFAULT_MODEL',
              '                gemini_tts_model = stable_selectbox(',
              '                    "Gemini TTS Model",',
              '                    options=voice.GEMINI_TTS_MODELS,',
              '                    default_value=saved_gemini_tts_model,',
              '                    key="gemini_tts_model_select",',
              '                )',
              '                _set_runtime_config("app", "gemini_tts_model", gemini_tts_model)',
          ]) + "\n"
          main_text, selector_count = selector_pattern.subn(
              selector_replacement, main_text, count=1
          )
          if selector_count != 1:
              raise SystemExit(f"Gemini model selector repair count: {selector_count}")
          main_path.write_text(main_text, encoding="utf-8")

      - name: Verify source compiles and markers are correctly nested
        shell: python
        run: |
          from pathlib import Path
          import py_compile

          py_compile.compile("app/services/voice.py", doraise=True)
          py_compile.compile("webui/Main.py", doraise=True)
          voice = Path("app/services/voice.py").read_text(encoding="utf-8")
          main = Path("webui/Main.py").read_text(encoding="utf-8")
          assert 'GEMINI_TTS_DEFAULT_MODEL = "gemini-3.1-flash-tts-preview"' in voice
          assert '            config.app.get("gemini_tts_model", GEMINI_TTS_DEFAULT_MODEL)' in voice
          assert '                saved_gemini_tts_model = str(' in main
          assert '                    options=voice.GEMINI_TTS_MODELS,' in main
          assert '                "gemini_tts_model", voice.GEMINI_TTS_DEFAULT_MODEL' in main

      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/voice.py webui/Main.py
          git commit -m "fix: repair Gemini TTS model selection indentation"
          git push origin HEAD:ui/six-clip-compact-sections
