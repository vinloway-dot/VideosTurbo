name: Patch Gemini 3.1 TTS

on:
  push:
    branches:
      - ui/six-clip-compact-sections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/six-clip-compact-sections

      - name: Apply Gemini TTS model selection
        shell: python
        run: |
          from pathlib import Path

          voice_path = Path("app/services/voice.py")
          voice_text = voice_path.read_text(encoding="utf-8")

          old_constants = '''MINIMAX_TTS_MODELS = (
              "speech-2.8-hd", "speech-2.8-turbo", "speech-2.6-hd", "speech-2.6-turbo",
              "speech-02-hd", "speech-02-turbo", "speech-01-hd", "speech-01-turbo",
          )
          GEMINI_TTS_VOICES = (
          '''
          new_constants = '''MINIMAX_TTS_MODELS = (
              "speech-2.8-hd", "speech-2.8-turbo", "speech-2.6-hd", "speech-2.6-turbo",
              "speech-02-hd", "speech-02-turbo", "speech-01-hd", "speech-01-turbo",
          )
          GEMINI_TTS_DEFAULT_MODEL = "gemini-3.1-flash-tts-preview"
          GEMINI_TTS_MODELS = (
              GEMINI_TTS_DEFAULT_MODEL,
              "gemini-2.5-flash-preview-tts",
              "gemini-2.5-pro-preview-tts",
          )
          GEMINI_TTS_VOICES = (
          '''
          if old_constants not in voice_text:
              raise SystemExit("Gemini constants insertion point not found")
          voice_text = voice_text.replace(old_constants, new_constants, 1)

          old_start = '''        logger.info(f"start, voice name: {voice_name}, try: 1")

              generation_config = types.GenerateContentConfig(
          '''
          new_start = '''        model = str(
                  config.app.get("gemini_tts_model", GEMINI_TTS_DEFAULT_MODEL)
                  or GEMINI_TTS_DEFAULT_MODEL
              ).strip()
              logger.info(f"start Gemini TTS, model: {model}, voice name: {voice_name}, try: 1")

              generation_config = types.GenerateContentConfig(
          '''
          if old_start not in voice_text:
              raise SystemExit("Gemini TTS start block not found")
          voice_text = voice_text.replace(old_start, new_start, 1)

          old_model = '''            response = client.models.generate_content(
                          model="gemini-2.5-flash-preview-tts",
                          contents=text,
                          config=generation_config,
                      )
          '''
          new_model = '''            response = client.models.generate_content(
                          model=model,
                          contents=text,
                          config=generation_config,
                      )
          '''
          if old_model not in voice_text:
              raise SystemExit("Hard-coded Gemini TTS model call not found")
          voice_text = voice_text.replace(old_model, new_model, 1)
          voice_path.write_text(voice_text, encoding="utf-8")

          main_path = Path("webui/Main.py")
          main_text = main_path.read_text(encoding="utf-8")

          old_signature = '''    if tts_server == "gemini-tts":
                  return {
                      "credential": _credential_signature(config.app.get("gemini_api_key", ""))
                  }
          '''
          new_signature = '''    if tts_server == "gemini-tts":
                  return {
                      "model_id": config.app.get(
                          "gemini_tts_model", voice.GEMINI_TTS_DEFAULT_MODEL
                      ),
                      "credential": _credential_signature(config.app.get("gemini_api_key", "")),
                  }
          '''
          if old_signature not in main_text:
              raise SystemExit("Gemini preview signature block not found")
          main_text = main_text.replace(old_signature, new_signature, 1)

          old_ui = '''                _set_runtime_config("app", "gemini_api_key", gemini_tts_api_key)

                      # 当选择硅基流动时，显示API key输入框和说明信息
          '''
          new_ui = '''                _set_runtime_config("app", "gemini_api_key", gemini_tts_api_key)

                      saved_gemini_tts_model = str(
                          config.app.get(
                              "gemini_tts_model", voice.GEMINI_TTS_DEFAULT_MODEL
                          )
                          or voice.GEMINI_TTS_DEFAULT_MODEL
                      ).strip()
                      if saved_gemini_tts_model not in voice.GEMINI_TTS_MODELS:
                          saved_gemini_tts_model = voice.GEMINI_TTS_DEFAULT_MODEL
                      gemini_tts_model = stable_selectbox(
                          "Gemini TTS Model",
                          options=voice.GEMINI_TTS_MODELS,
                          default_value=saved_gemini_tts_model,
                          key="gemini_tts_model_select",
                      )
                      _set_runtime_config("app", "gemini_tts_model", gemini_tts_model)

                      # 当选择硅基流动时，显示API key输入框和说明信息
          '''
          if old_ui not in main_text:
              raise SystemExit("Gemini WebUI settings insertion point not found")
          main_text = main_text.replace(old_ui, new_ui, 1)
          main_path.write_text(main_text, encoding="utf-8")

          test_voice_path = Path("test/services/test_voice.py")
          test_voice_text = test_voice_path.read_text(encoding="utf-8")
          old_expectation = '        self.assertEqual(captured["model"], "gemini-2.5-flash-preview-tts")\n'
          new_expectation = '        self.assertEqual(captured["model"], vs.GEMINI_TTS_DEFAULT_MODEL)\n'
          if old_expectation not in test_voice_text:
              raise SystemExit("Legacy Gemini model expectation not found")
          test_voice_path.write_text(
              test_voice_text.replace(old_expectation, new_expectation, 1),
              encoding="utf-8",
          )

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/voice.py webui/Main.py test/services/test_voice.py
          git commit -m "feat: add Gemini 3.1 TTS model selection"
          git push origin HEAD:ui/six-clip-compact-sections
