name: Patch Gemini 3.1 TTS

on:
  push:
    branches:
      - ui/six-clip-compact-sections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/six-clip-compact-sections

      - name: Apply Gemini TTS model selection
        shell: python
        run: |
          from pathlib import Path

          voice_path = Path("app/services/voice.py")
          voice_text = voice_path.read_text(encoding="utf-8")

          voice_marker = "GEMINI_TTS_VOICES = ("
          constants = """GEMINI_TTS_DEFAULT_MODEL = \"gemini-3.1-flash-tts-preview\"
          GEMINI_TTS_MODELS = (
              GEMINI_TTS_DEFAULT_MODEL,
              \"gemini-2.5-flash-preview-tts\",
              \"gemini-2.5-pro-preview-tts\",
          )
          GEMINI_TTS_VOICES = ("""
          if "GEMINI_TTS_DEFAULT_MODEL" not in voice_text:
              if voice_marker not in voice_text:
                  raise SystemExit("Gemini voice catalog marker not found")
              voice_text = voice_text.replace(voice_marker, constants, 1)

          logger_line = '        logger.info(f"start, voice name: {voice_name}, try: 1")'
          model_setup = """        model = str(
              config.app.get(\"gemini_tts_model\", GEMINI_TTS_DEFAULT_MODEL)
              or GEMINI_TTS_DEFAULT_MODEL
          ).strip()
          logger.info(
              f\"start Gemini TTS, model: {model}, voice name: {voice_name}, try: 1\"
          )"""
          if 'config.app.get("gemini_tts_model", GEMINI_TTS_DEFAULT_MODEL)' not in voice_text:
              if logger_line not in voice_text:
                  raise SystemExit("Gemini TTS logger marker not found")
              voice_text = voice_text.replace(logger_line, model_setup, 1)

          hardcoded_model = 'model="gemini-2.5-flash-preview-tts"'
          if hardcoded_model in voice_text:
              voice_text = voice_text.replace(hardcoded_model, "model=model", 1)
          voice_path.write_text(voice_text, encoding="utf-8")

          main_path = Path("webui/Main.py")
          main_text = main_path.read_text(encoding="utf-8")

          credential_line = '            "credential": _credential_signature(config.app.get("gemini_api_key", ""))'
          model_signature = """            \"model_id\": config.app.get(
              \"gemini_tts_model\", voice.GEMINI_TTS_DEFAULT_MODEL
          ),
          """ + credential_line + ","
          gemini_signature_block = main_text.split('if tts_server == "gemini-tts":', 1)[1].split("return {}", 1)[0]
          if '"model_id": config.app.get(' not in gemini_signature_block:
              if credential_line not in main_text:
                  raise SystemExit("Gemini preview credential marker not found")
              main_text = main_text.replace(credential_line, model_signature, 1)

          api_key_line = '                _set_runtime_config("app", "gemini_api_key", gemini_tts_api_key)'
          selector = """

              saved_gemini_tts_model = str(
                  config.app.get(
                      \"gemini_tts_model\", voice.GEMINI_TTS_DEFAULT_MODEL
                  )
                  or voice.GEMINI_TTS_DEFAULT_MODEL
              ).strip()
              if saved_gemini_tts_model not in voice.GEMINI_TTS_MODELS:
                  saved_gemini_tts_model = voice.GEMINI_TTS_DEFAULT_MODEL
              gemini_tts_model = stable_selectbox(
                  \"Gemini TTS Model\",
                  options=voice.GEMINI_TTS_MODELS,
                  default_value=saved_gemini_tts_model,
                  key=\"gemini_tts_model_select\",
              )
              _set_runtime_config(\"app\", \"gemini_tts_model\", gemini_tts_model)"""
          if 'key="gemini_tts_model_select"' not in main_text:
              if api_key_line not in main_text:
                  raise SystemExit("Gemini API key config marker not found")
              main_text = main_text.replace(api_key_line, api_key_line + selector, 1)
          main_path.write_text(main_text, encoding="utf-8")

          test_voice_path = Path("test/services/test_voice.py")
          test_voice_text = test_voice_path.read_text(encoding="utf-8")
          old_expectation = 'self.assertEqual(captured["model"], "gemini-2.5-flash-preview-tts")'
          new_expectation = 'self.assertEqual(captured["model"], vs.GEMINI_TTS_DEFAULT_MODEL)'
          if old_expectation in test_voice_text:
              test_voice_text = test_voice_text.replace(old_expectation, new_expectation, 1)
          test_voice_path.write_text(test_voice_text, encoding="utf-8")

      - name: Verify patch markers
        shell: python
        run: |
          from pathlib import Path
          voice = Path("app/services/voice.py").read_text(encoding="utf-8")
          main = Path("webui/Main.py").read_text(encoding="utf-8")
          assert 'GEMINI_TTS_DEFAULT_MODEL = "gemini-3.1-flash-tts-preview"' in voice
          assert 'model=model' in voice
          assert '"Gemini TTS Model"' in main
          assert 'options=voice.GEMINI_TTS_MODELS' in main
          assert '"model_id": config.app.get(' in main

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/voice.py webui/Main.py test/services/test_voice.py
          git commit -m "feat: add Gemini 3.1 TTS model selection"
          git push origin HEAD:ui/six-clip-compact-sections
