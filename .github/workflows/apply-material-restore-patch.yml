name: Apply material restore patch

on:
  push:
    branches:
      - feature/material-type-mixed
    paths:
      - .github/workflows/apply-material-restore-patch.yml

permissions:
  contents: write

jobs:
  apply-exact-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/material-type-mixed
          fetch-depth: 0

      - name: Apply exact Task History restore patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("webui/Main.py")
          source = path.read_text(encoding="utf-8")

          old_import = '''from app.services import (
              cache_manager,
              llm,
              loomloom,
              video,
              voice,
              webui_task,
          )'''
          new_import = '''from app.services import (
              cache_manager,
              llm,
              loomloom,
              stock_materials,
              video,
              voice,
              webui_task,
          )'''

          old_restore = '''    # 视频设置。素材上传控件不能由服务端写入，因此本地素材需要用户重新选择。
              video_source = params.get("video_source") or "pexels"
              _set_stable_widget_value("video_source_select", video_source)
              _set_stable_widget_value(
                  "video_concat_mode_select", params.get("video_concat_mode") or "random"
              )'''
          new_restore = '''    # 视频设置。素材上传控件不能由服务端写入，因此本地素材需要用户重新选择。
              video_source = params.get("video_source") or "pexels"
              base_video_source = stock_materials.base_source(video_source)
              restored_material_type = params.get("material_type") or "video"
              _set_stable_widget_value("video_source_select", base_video_source)
              _set_stable_widget_value(
                  f"material_type_for_{base_video_source}",
                  restored_material_type,
              )
              _set_stable_widget_value(
                  f"image_duration_for_{base_video_source}",
                  params.get("image_duration", 8),
              )
              _set_stable_widget_value(
                  f"image_motion_for_{base_video_source}",
                  params.get("image_motion") or "random",
              )
              _set_stable_widget_value(
                  "video_concat_mode_select", params.get("video_concat_mode") or "random"
              )'''

          if source.count(old_import) != 1:
              raise SystemExit(
                  f"expected exactly one services import block, found {source.count(old_import)}"
              )
          if source.count(old_restore) != 1:
              raise SystemExit(
                  f"expected exactly one task restore block, found {source.count(old_restore)}"
              )

          patched = source.replace(old_import, new_import, 1).replace(
              old_restore, new_restore, 1
          )
          path.write_text(patched, encoding="utf-8")

      - name: Verify patch shape and syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile webui/Main.py
          git diff --check
          grep -F 'base_video_source = stock_materials.base_source(video_source)' webui/Main.py
          grep -F 'f"material_type_for_{base_video_source}"' webui/Main.py
          grep -F 'f"image_duration_for_{base_video_source}"' webui/Main.py
          grep -F 'f"image_motion_for_{base_video_source}"' webui/Main.py
          grep -F 'f"video_aspect_for_{video_source}"' webui/Main.py

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/Main.py
          git commit -m "fix: restore image material settings from task history"
          git push origin HEAD:feature/material-type-mixed
