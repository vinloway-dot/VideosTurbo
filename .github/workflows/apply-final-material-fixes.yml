name: Apply final material fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-final-material-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/material-type-mixed
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Apply exact production fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path_text, old, new):
              path = Path(path_text)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one block in {path_text}, found {count}"
                  )
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "app/services/stock_images.py",
              '''def _download_image(item: MaterialInfo, directory: Path, index: int) -> Path:
              response = requests.get(
                  item.url,
                  proxies=config.proxy,
                  verify=material._get_tls_verify(),
                  timeout=(30, 120),
              )
              response.raise_for_status()
              content_type = (
                  str((response.headers or {}).get("content-type", ""))
                  .split(";", 1)[0]
                  .lower()
              )
              if content_type and content_type not in _IMAGE_CONTENT_TYPES:
                  raise ValueError(f"unexpected image content type: {content_type}")
              if not response.content:
                  raise ValueError("downloaded image is empty")

              source = item.source_info if isinstance(item.source_info, dict) else {}
              raw_asset_id = source.get("asset_id")
              identity = _SAFE_FILENAME.sub(
                  "-",
                  str(raw_asset_id if raw_asset_id not in (None, "") else index),
              ).strip("-_") or str(index)
              extension = _extension_for_image(item, response)
              target = directory / f"stock-image-{identity}{extension}"
              suffix = 2
              while target.exists():
                  target = directory / f"stock-image-{identity}-{suffix}{extension}"
                  suffix += 1
              target.write_bytes(response.content)
              return target''',
              '''def _download_image(item: MaterialInfo, directory: Path, index: int) -> Path:
              source = item.source_info if isinstance(item.source_info, dict) else {}
              raw_asset_id = source.get("asset_id")
              asset_identity = _SAFE_FILENAME.sub(
                  "-",
                  str(raw_asset_id if raw_asset_id not in (None, "") else index),
              ).strip("-_") or str(index)
              provider_identity = _SAFE_FILENAME.sub(
                  "-",
                  str(item.provider or source.get("provider") or "unknown").strip().lower(),
              ).strip("-_") or "unknown"
              identity = f"{provider_identity}-{asset_identity}"

              for extension in (".jpg", ".jpeg", ".png", ".webp"):
                  existing = directory / f"stock-image-{identity}{extension}"
                  if existing.is_file() and existing.stat().st_size > 0:
                      logger.info(f"stock image already exists: {existing}")
                      return existing

              response = requests.get(
                  item.url,
                  proxies=config.proxy,
                  verify=material._get_tls_verify(),
                  timeout=(30, 120),
              )
              response.raise_for_status()
              content_type = (
                  str((response.headers or {}).get("content-type", ""))
                  .split(";", 1)[0]
                  .lower()
              )
              if content_type and content_type not in _IMAGE_CONTENT_TYPES:
                  raise ValueError(f"unexpected image content type: {content_type}")
              if not response.content:
                  raise ValueError("downloaded image is empty")

              extension = _extension_for_image(item, response)
              target = directory / f"stock-image-{identity}{extension}"
              if target.is_file() and target.stat().st_size > 0:
                  return target
              target.write_bytes(response.content)
              return target''',
          )

          replace_exact(
              "app/services/image_materials.py",
              '''        selected_motion = choose_image_motion(image_motion, rng=rng)
                  base_filename = output_filename_for_image(image_path)
                  output_path = destination / base_filename
                  output_stem = Path(base_filename).stem
                  suffix = 2
                  while output_path.exists():
                      output_path = destination / f"{output_stem}-{suffix}.mp4"
                      suffix += 1''',
              '''        base_filename = output_filename_for_image(image_path)
                  output_path = destination / base_filename
                  is_stable_stock_image = image_path.name.startswith("stock-image-")
                  if (
                      is_stable_stock_image
                      and output_path.is_file()
                      and output_path.stat().st_size > 0
                  ):
                      logger.info(f"prepared stock image clip already exists: {output_path}")
                      results.append(str(output_path))
                      continue

                  if is_stable_stock_image and output_path.exists():
                      output_path.unlink(missing_ok=True)
                  elif not is_stable_stock_image:
                      output_stem = Path(base_filename).stem
                      suffix = 2
                      while output_path.exists():
                          output_path = destination / f"{output_stem}-{suffix}.mp4"
                          suffix += 1

                  selected_motion = choose_image_motion(image_motion, rng=rng)''',
          )

          replace_exact(
              "webui/Main.py",
              '    restored_material_type = params.get("material_type") or "video"',
              '    restored_material_type = str(params.get("material_type") or "video")',
          )

      - name: Verify focused regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff check \
            app/services/stock_images.py \
            app/services/image_materials.py \
            webui/Main.py \
            test/services/test_stock_image_identity.py \
            test/services/test_image_materials.py \
            test/services/test_stock_images.py \
            test/services/test_webui_material_type.py
          uv run --no-sync pytest -q \
            test/services/test_stock_image_identity.py \
            test/services/test_image_materials.py \
            test/services/test_stock_images.py \
            test/services/test_webui_material_type.py
          git diff --check

      - name: Commit verified production fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/stock_images.py app/services/image_materials.py webui/Main.py
          git commit -m "fix: stabilize stock image reuse and task restore"
          git push origin HEAD:feature/material-type-mixed
