name: Apply six clip integration patch

on:
  push:
    branches:
      - feature/six-clip-media-timeline
    paths:
      - .github/workflows/apply-six-clip-integration.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/six-clip-media-timeline
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply exact integration patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              source = file_path.read_text(encoding="utf-8")
              if new in source:
                  return
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch target, found {count}")
              file_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          # ------------------------------------------------------------------
          # schema.py: backwards-compatible six-clip task fields.
          # ------------------------------------------------------------------
          replace_once(
              "app/models/schema.py",
              "from app.config import config\n",
              "from app.config import config\nfrom app.models.six_clip import SixClipPlan\n",
          )
          replace_once(
              "app/models/schema.py",
              '''    video_script: str = ""  # Script used to generate the video\n    video_terms: Optional[str | list] = None  # Keywords used to generate the video\n    video_aspect: Optional[VideoAspect] = VideoAspect.portrait.value\n''',
              '''    video_script: str = ""  # Script used to generate the video\n    video_terms: Optional[str | list] = None  # Keywords used to generate the video\n    target_words: int = Field(default=130, ge=40, le=400)\n    six_clip_mode: bool = False\n    six_clip_plan: Optional[SixClipPlan] = None\n    video_aspect: Optional[VideoAspect] = VideoAspect.portrait.value\n''',
          )

          # ------------------------------------------------------------------
          # task.py: fail-closed preflight and deterministic renderer route.
          # ------------------------------------------------------------------
          replace_once(
              "app/services/task.py",
              '''    loomloom,\n    material,\n    sonilo,\n''',
              '''    loomloom,\n    material,\n    six_clip_media,\n    six_clip_render,\n    sonilo,\n''',
          )
          replace_once(
              "app/services/task.py",
              '''    logger.info(f"start task: {task_id}, stop_at: {stop_at}")\n    sm.state.update_task(task_id, state=const.TASK_STATE_PROCESSING, progress=5)\n\n    # 只有完整成片流程需要视频配乐供应商。尽早阻止缺少 Key 的完整任务，避免\n''',
              '''    logger.info(f"start task: {task_id}, stop_at: {stop_at}")\n    sm.state.update_task(task_id, state=const.TASK_STATE_PROCESSING, progress=5)\n\n    if params.six_clip_mode:\n        if params.six_clip_plan is None:\n            return _mark_task_failed(\n                task_id,\n                "preflight",\n                "Cannot generate video. Six-clip plan is missing.",\n            )\n        missing_media = six_clip_media.validate_ready_media(params.six_clip_plan)\n        if missing_media:\n            return _mark_task_failed(\n                task_id,\n                "preflight",\n                "Cannot generate video. Missing media: "\n                + six_clip_media.missing_media_message(params.six_clip_plan),\n            )\n\n    # 只有完整成片流程需要视频配乐供应商。尽早阻止缺少 Key 的完整任务，避免\n''',
          )
          replace_once(
              "app/services/task.py",
              '''    video_terms = ""\n    if params.video_source != "local":\n''',
              '''    video_terms = ""\n    if not params.six_clip_mode and params.video_source != "local":\n''',
          )
          replace_once(
              "app/services/task.py",
              '''    if not audio_file:\n        return _mark_task_failed(\n            task_id,\n            "audio",\n            "failed to prepare narration audio",\n        )\n\n    sm.state.update_task(task_id, state=const.TASK_STATE_PROCESSING, progress=30)\n''',
              '''    if not audio_file:\n        return _mark_task_failed(\n            task_id,\n            "audio",\n            "failed to prepare narration audio",\n        )\n    if params.six_clip_mode and float(audio_duration or 0) > 60.0:\n        return _mark_task_failed(\n            task_id,\n            "audio",\n            (\n                f"Narration is {float(audio_duration):.1f} seconds; the six-clip timeline "\n                "is fixed at 60 seconds. Reduce Target Words or increase Voice Rate."\n            ),\n        )\n\n    sm.state.update_task(task_id, state=const.TASK_STATE_PROCESSING, progress=30)\n''',
          )
          replace_once(
              "app/services/task.py",
              '''    # 5. Get video materials\n    downloaded_videos = get_video_materials(\n        task_id,\n        params,\n        video_terms,\n        audio_duration,\n        loomloom_video_request=loomloom_video_request,\n    )\n    if not downloaded_videos:\n        return _mark_task_failed(\n            task_id,\n            "materials",\n            "failed to prepare video materials",\n        )\n\n    if stop_at == "materials":\n''',
              '''    # 5. Get video materials\n    six_clip_combined_video = None\n    if params.six_clip_mode:\n        try:\n            downloaded_videos = six_clip_render.prepare_six_clip_timeline(\n                task_id,\n                params.six_clip_plan,\n                video_aspect=params.video_aspect,\n                image_motion=params.image_motion,\n                threads=params.n_threads or 2,\n            )\n            six_clip_combined_video = six_clip_render.concat_six_clip_timeline(\n                downloaded_videos,\n                path.join(utils.task_dir(task_id), "combined-six-clip.mp4"),\n                threads=params.n_threads or 2,\n            )\n        except six_clip_render.SixClipRenderError as exc:\n            return _mark_task_failed(task_id, "materials", str(exc))\n    else:\n        downloaded_videos = get_video_materials(\n            task_id,\n            params,\n            video_terms,\n            audio_duration,\n            loomloom_video_request=loomloom_video_request,\n        )\n    if not downloaded_videos:\n        return _mark_task_failed(\n            task_id,\n            "materials",\n            "failed to prepare video materials",\n        )\n\n    if stop_at == "materials":\n''',
          )
          replace_once(
              "app/services/task.py",
              '''def generate_final_videos(\n    task_id, params, downloaded_videos, audio_file, subtitle_path, audio_duration\n):\n''',
              '''def generate_final_videos(\n    task_id,\n    params,\n    downloaded_videos,\n    audio_file,\n    subtitle_path,\n    audio_duration,\n    combined_video_override=None,\n):\n''',
          )
          replace_once(
              "app/services/task.py",
              '''        combined_video_path = path.join(\n            utils.task_dir(task_id), f"combined-{index}.mp4"\n        )\n        logger.info(f"\\n\\n## combining video: {index} => {combined_video_path}")\n        video.combine_videos(\n            combined_video_path=combined_video_path,\n            video_paths=downloaded_videos,\n            audio_file=audio_file,\n            video_aspect=params.video_aspect,\n            video_concat_mode=video_concat_mode,\n            video_transition_mode=video_transition_mode,\n            max_clip_duration=params.video_clip_duration,\n            threads=params.n_threads,\n            clip_speed=params.video_clip_speed,\n            clip_duration_overrides=clip_duration_overrides,\n        )\n''',
              '''        combined_video_path = combined_video_override or path.join(\n            utils.task_dir(task_id), f"combined-{index}.mp4"\n        )\n        if combined_video_override:\n            logger.info(\n                f"\\n\\n## using fixed six-clip timeline: {index} => {combined_video_path}"\n            )\n        else:\n            logger.info(f"\\n\\n## combining video: {index} => {combined_video_path}")\n            video.combine_videos(\n                combined_video_path=combined_video_path,\n                video_paths=downloaded_videos,\n                audio_file=audio_file,\n                video_aspect=params.video_aspect,\n                video_concat_mode=video_concat_mode,\n                video_transition_mode=video_transition_mode,\n                max_clip_duration=params.video_clip_duration,\n                threads=params.n_threads,\n                clip_speed=params.video_clip_speed,\n                clip_duration_overrides=clip_duration_overrides,\n            )\n''',
          )
          replace_once(
              "app/services/task.py",
              '''            subtitle_path,\n            audio_duration,\n        )\n''',
              '''            subtitle_path,\n            audio_duration,\n            combined_video_override=six_clip_combined_video,\n        )\n''',
          )

          # ------------------------------------------------------------------
          # Main.py: Section 1 target words, fixed video settings, Sections 2/3.
          # ------------------------------------------------------------------
          replace_once(
              "webui/Main.py",
              '''    llm,\n    loomloom,\n    stock_materials,\n''',
              '''    llm,\n    loomloom,\n    six_clip_media,\n    six_clip_plan,\n    stock_materials,\n''',
          )
          replace_once(
              "webui/Main.py",
              '''from app.utils.logging_utils import configure_terminal_logger\nfrom app.utils import utils\n''',
              '''from app.utils.logging_utils import configure_terminal_logger\nfrom app.utils import utils\nfrom webui import six_clip_timeline\n''',
          )
          replace_once(
              "webui/Main.py",
              '''            params.video_language = selected_language_code\n            _set_runtime_config("ui", "video_language", params.video_language)\n\n            # 使用带 key 的局部容器限定折叠入口样式，保持 expander 的原生交互，\n''',
              '''            params.video_language = selected_language_code\n            _set_runtime_config("ui", "video_language", params.video_language)\n\n            params.target_words = st.number_input(\n                "Target Words",\n                min_value=40,\n                max_value=400,\n                value=int(config.ui.get("target_words", 130) or 130),\n                step=5,\n                key="target_words_input",\n                help="Approximate narration word count for the 60-second script.",\n            )\n            _set_runtime_config("ui", "target_words", int(params.target_words))\n\n            # 使用带 key 的局部容器限定折叠入口样式，保持 expander 的原生交互，\n''',
          )
          replace_once(
              "webui/Main.py",
              '''            script = llm.generate_script(\n                video_subject=params.video_subject,\n                language=params.video_language,\n                paragraph_number=params.paragraph_number,\n                video_script_prompt=params.video_script_prompt,\n                custom_system_prompt=params.custom_system_prompt,\n                app_config=app_config_snapshot,\n            )\n            terms = llm.generate_terms(\n                params.video_subject,\n                script,\n                amount=8 if params.match_materials_to_script else 5,\n                match_script_order=params.match_materials_to_script,\n                app_config=app_config_snapshot,\n            )\n            return script, terms\n\n        script, terms = _run_llm_read_operation(\n            "generate_script_and_terms",\n            generate_script_and_terms,\n        )\n''',
              '''            script_requirements = six_clip_plan.build_script_generation_requirements(\n                params.target_words,\n                params.video_script_prompt,\n            )\n            script = llm.generate_script(\n                video_subject=params.video_subject,\n                language=params.video_language,\n                paragraph_number=params.paragraph_number,\n                video_script_prompt=script_requirements,\n                custom_system_prompt=params.custom_system_prompt,\n                app_config=app_config_snapshot,\n            )\n            terms = llm.generate_terms(\n                params.video_subject,\n                script,\n                amount=5,\n                match_script_order=False,\n                app_config=app_config_snapshot,\n            )\n            clip_plan = six_clip_plan.generate_six_clip_plan(\n                script,\n                language=params.video_language,\n                target_words=params.target_words,\n                app_config=app_config_snapshot,\n            )\n            return script, terms, clip_plan\n\n        script, terms, clip_plan = _run_llm_read_operation(\n            "generate_script_terms_and_six_clip_plan",\n            generate_script_and_terms,\n        )\n''',
          )
          replace_once(
              "webui/Main.py",
              '''        else:\n            st.session_state["video_script"] = script\n            st.session_state["video_terms"] = ", ".join(terms)\n\n\ndef _render_loomloom_candidates():\n''',
              '''        else:\n            st.session_state["video_script"] = script\n            st.session_state["video_terms"] = ", ".join(terms)\n            six_clip_timeline.set_session_plan(clip_plan, sync_widgets=True)\n\n\ndef _render_loomloom_candidates():\n''',
          )
          replace_once(
              "webui/Main.py",
              '''def _estimate_voiceover_duration_range(\n''',
              '''def _render_six_clip_video_settings(panel, params):\n    """Render only settings that still apply to the fixed six-clip timeline."""\n    with panel:\n        with st.container(border=True):\n            st.write("Video Settings")\n            st.caption("Visual Source: six fixed user media clips (6 × 10 seconds).")\n            params.six_clip_mode = True\n            params.video_source = "six_clip"\n            params.video_concat_mode = VideoConcatMode.sequential\n            params.video_transition_mode = VideoTransitionMode.none\n            params.video_clip_duration = 10\n            params.video_clip_speed = 1.0\n            params.video_count = 1\n            params.match_materials_to_script = False\n            params.image_duration = 10\n\n            video_aspect_ratios = [\n                (tr("Portrait"), VideoAspect.portrait.value),\n                (tr("Landscape"), VideoAspect.landscape.value),\n            ]\n            aspect_values = [value for _, value in video_aspect_ratios]\n            selected_aspect = stable_selectbox(\n                tr("Video Ratio"),\n                options=aspect_values,\n                default_value=_saved_ui_choice(\n                    "six_clip_video_aspect",\n                    aspect_values,\n                    VideoAspect.portrait.value,\n                ),\n                key="six_clip_video_aspect_select",\n                format_func=lambda value: dict(\n                    (v, label) for label, v in video_aspect_ratios\n                )[value],\n            )\n            params.video_aspect = VideoAspect(selected_aspect)\n            _set_runtime_config("ui", "six_clip_video_aspect", params.video_aspect.value)\n\n            motion_labels = {\n                "slow_zoom_in": "Slow Zoom In",\n                "slow_zoom_out": "Slow Zoom Out",\n                "pan_left_right": "Pan Left → Right",\n                "pan_right_left": "Pan Right → Left",\n                "random": "Random",\n                "none": "None",\n            }\n            params.image_motion = stable_selectbox(\n                "Image Ken Burns Effect",\n                options=list(motion_labels),\n                default_value=_saved_ui_choice(\n                    "six_clip_image_motion", list(motion_labels), "random"\n                ),\n                key="six_clip_image_motion_select",\n                format_func=lambda value: motion_labels[value],\n            )\n            _set_runtime_config("ui", "six_clip_image_motion", params.image_motion)\n\n            video_codec_options = [\n                (tr("Default Video Encoder"), DEFAULT_VIDEO_CODEC_OPTION),\n                ("libx264 (CPU)", "libx264"),\n                ("NVIDIA NVENC (h264_nvenc)", "h264_nvenc"),\n                ("AMD AMF (h264_amf)", "h264_amf"),\n                ("Intel QSV (h264_qsv)", "h264_qsv"),\n                ("Windows MediaFoundation (h264_mf)", "h264_mf"),\n                ("macOS VideoToolbox (h264_videotoolbox)", "h264_videotoolbox"),\n            ]\n            codec_values = [item[1] for item in video_codec_options]\n            saved_codec = config.app.get("video_codec", DEFAULT_VIDEO_CODEC_OPTION)\n            if saved_codec not in codec_values:\n                saved_codec = DEFAULT_VIDEO_CODEC_OPTION\n            selected_codec = stable_selectbox(\n                tr("Video Encoder"),\n                options=codec_values,\n                default_value=saved_codec,\n                key="six_clip_video_encoder_select",\n                format_func=lambda value: dict(\n                    (v, label) for label, v in video_codec_options\n                )[value],\n                help=tr("Video Encoder Help"),\n            )\n            if selected_codec == DEFAULT_VIDEO_CODEC_OPTION:\n                _delete_runtime_config("app", "video_codec")\n            else:\n                _set_runtime_config("app", "video_codec", selected_codec)\n    return []\n\n\ndef _estimate_voiceover_duration_range(\n''',
          )
          replace_once(
              "webui/Main.py",
              '''        if not params.video_subject and not params.video_script:\n            _remove_active_generation_task(task_id)\n            st.error(tr("Video Script and Subject Cannot Both Be Empty"))\n            st.stop()\n\n        validated_video_source = stock_materials.base_source(params.video_source)\n        if validated_video_source not in [\n            "pexels",\n            "pixabay",\n            "coverr",\n            "loomloom",\n            "local",\n        ]:\n            _remove_active_generation_task(task_id)\n            st.error(tr("Please Select a Valid Video Source"))\n            st.stop()\n\n        if validated_video_source == "pexels" and not config.app.get(\n            "pexels_api_keys", ""\n        ):\n            _remove_active_generation_task(task_id)\n            st.error(tr("Please Enter the Pexels API Key"))\n            st.stop()\n\n        if validated_video_source == "pixabay" and not config.app.get(\n            "pixabay_api_keys", ""\n        ):\n            _remove_active_generation_task(task_id)\n            st.error(tr("Please Enter the Pixabay API Key"))\n            st.stop()\n\n        if validated_video_source == "coverr" and not config.app.get(\n            "coverr_api_keys", ""\n        ):\n            _remove_active_generation_task(task_id)\n            st.error(tr("Please Enter the Coverr API Key"))\n            st.stop()\n''',
              '''        if not params.video_subject and not params.video_script:\n            _remove_active_generation_task(task_id)\n            st.error(tr("Video Script and Subject Cannot Both Be Empty"))\n            st.stop()\n\n        if params.six_clip_mode:\n            if params.six_clip_plan is None:\n                _remove_active_generation_task(task_id)\n                st.error("Six-clip plan is missing.")\n                st.stop()\n            try:\n                params.six_clip_plan = six_clip_media.materialize_plan_for_task(\n                    params.six_clip_plan,\n                    utils.task_dir(task_id),\n                )\n            except six_clip_media.SixClipMediaError as exc:\n                _remove_active_generation_task(task_id)\n                st.error(f"Cannot generate video. {exc}")\n                st.stop()\n        else:\n            validated_video_source = stock_materials.base_source(params.video_source)\n            if validated_video_source not in [\n                "pexels",\n                "pixabay",\n                "coverr",\n                "loomloom",\n                "local",\n            ]:\n                _remove_active_generation_task(task_id)\n                st.error(tr("Please Select a Valid Video Source"))\n                st.stop()\n\n            if validated_video_source == "pexels" and not config.app.get(\n                "pexels_api_keys", ""\n            ):\n                _remove_active_generation_task(task_id)\n                st.error(tr("Please Enter the Pexels API Key"))\n                st.stop()\n\n            if validated_video_source == "pixabay" and not config.app.get(\n                "pixabay_api_keys", ""\n            ):\n                _remove_active_generation_task(task_id)\n                st.error(tr("Please Enter the Pixabay API Key"))\n                st.stop()\n\n            if validated_video_source == "coverr" and not config.app.get(\n                "coverr_api_keys", ""\n            ):\n                _remove_active_generation_task(task_id)\n                st.error(tr("Please Enter the Coverr API Key"))\n                st.stop()\n''',
          )
          replace_once(
              "webui/Main.py",
              '''        if params.video_source == "local" and not has_local_materials:\n''',
              '''        if (\n            not params.six_clip_mode\n            and params.video_source == "local"\n            and not has_local_materials\n        ):\n''',
          )
          replace_once(
              "webui/Main.py",
              '''    uploaded_files = _render_video_settings(middle_panel, params)\n''',
              '''    uploaded_files = _render_six_clip_video_settings(middle_panel, params)\n''',
          )
          replace_once(
              "webui/Main.py",
              '''    _render_subtitle_settings(right_panel, params)\n\n    generation_submitted = _render_generation_controls(\n''',
              '''    _render_subtitle_settings(right_panel, params)\n\n    def refresh_six_clip_plan():\n        current_script = str(params.video_script or "").strip()\n        if not current_script:\n            raise ValueError("Generate or enter the Video Script first.")\n        return _run_llm_read_operation(\n            "generate_six_clip_plan",\n            lambda app_config_snapshot: six_clip_plan.generate_six_clip_plan(\n                current_script,\n                language=params.video_language,\n                target_words=params.target_words,\n                app_config=app_config_snapshot,\n            ),\n        )\n\n    params.six_clip_plan = six_clip_timeline.render_six_clip_sections(\n        params.target_words,\n        refresh_plan=refresh_six_clip_plan,\n    )\n    params.six_clip_mode = True\n\n    generation_submitted = _render_generation_controls(\n''',
          )

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Verify focused six-clip tests
        run: >-
          uv run --no-sync pytest -q
          test/services/test_six_clip_plan.py
          test/services/test_six_clip_ai.py
          test/services/test_six_clip_media.py
          test/services/test_six_clip_render.py
          test/services/test_six_clip_task_pipeline.py

      - name: Compile and lint changed code
        run: |
          uv run --no-sync python -m py_compile app/models/schema.py app/models/six_clip.py app/services/six_clip_plan.py app/services/six_clip_media.py app/services/six_clip_render.py app/services/task.py webui/Main.py webui/six_clip_timeline.py
          uv run --no-sync ruff check app/models/schema.py app/models/six_clip.py app/services/six_clip_plan.py app/services/six_clip_media.py app/services/six_clip_render.py app/services/task.py webui/Main.py webui/six_clip_timeline.py test/services/test_six_clip_plan.py test/services/test_six_clip_ai.py test/services/test_six_clip_media.py test/services/test_six_clip_render.py test/services/test_six_clip_task_pipeline.py
          git diff --check

      - name: Commit integration
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/models/schema.py app/services/task.py webui/Main.py
          git commit -m "feat: integrate six clip timeline into main generator"
          git push origin HEAD:feature/six-clip-media-timeline
