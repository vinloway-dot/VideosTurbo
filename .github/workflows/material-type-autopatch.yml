name: Material Type Autopatch

on:
  push:
    branches:
      - feature/material-type-mixed

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[autopatch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/material-type-mixed
          fetch-depth: 0

      - name: Apply exact source patches
        run: python scripts/apply_material_type_patches.py

      - name: Commit and push wiring changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/material.py app/services/task.py app/services/music_batch/manager.py webui/Main.py webui/music_batch.py
          git commit -m "feat: wire material type UI and pipeline [autopatch]"
          git push origin HEAD:feature/material-type-mixed
