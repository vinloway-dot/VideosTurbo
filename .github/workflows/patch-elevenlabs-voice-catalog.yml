name: Patch ElevenLabs Voice Catalog

on:
  push:
    branches:
      - ui/six-clip-compact-sections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/six-clip-compact-sections

      - name: Apply ElevenLabs voice catalog fix
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("app/services/voice.py"): [
                  (
                      '        params = {"is_favorite": "true", "page_size": 100}',
                      '        params = {"page_size": 100}',
                  ),
              ],
              Path("webui/i18n/en.json"): [
                  (
                      '    "tts_provider_tips.elevenlabs": "Requires an [API key](https://elevenlabs.io/app/settings/api-keys). Add voices to your favorites in the [Voice Library](https://elevenlabs.io/app/voice-library) first.",',
                      '    "tts_provider_tips.elevenlabs": "Requires an [API key](https://elevenlabs.io/app/settings/api-keys). Default and account voices load automatically. Community [Voice Library](https://elevenlabs.io/app/voice-library) API access depends on your ElevenLabs plan.",',
                  ),
              ],
              Path("webui/i18n/zh.json"): [
                  (
                      '    "tts_provider_tips.elevenlabs": "需要 [API Key](https://elevenlabs.io/app/settings/api-keys)；请先在 [Voice Library](https://elevenlabs.io/app/voice-library) 将音色加入收藏。",',
                      '    "tts_provider_tips.elevenlabs": "需要 [API Key](https://elevenlabs.io/app/settings/api-keys)；默认音色和账号已有音色会自动加载；社区 [Voice Library](https://elevenlabs.io/app/voice-library) 的 API 访问权限取决于 ElevenLabs 套餐。",',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      if new in text:
                          continue
                      raise SystemExit(f"expected source block not found: {path}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/voice.py webui/i18n/en.json webui/i18n/zh.json
          git commit -m "fix: load ElevenLabs voices with current API"
          git push origin HEAD:ui/six-clip-compact-sections
