name: Patch ElevenLabs Voice Diagnostics

on:
  push:
    branches:
      - ui/six-clip-compact-sections

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/six-clip-compact-sections

      - name: Apply ElevenLabs diagnostics and refresh fix
        shell: python
        run: |
          from pathlib import Path

          voice_path = Path("app/services/voice.py")
          voice_text = voice_path.read_text(encoding="utf-8")
          old_voice = '''def get_elevenlabs_voices(api_key: str) -> list[str]:
              if not api_key:
                  return []
              try:
                  url = "https://api.elevenlabs.io/v2/voices"
                  params = {"page_size": 100}
                  headers = {"xi-api-key": api_key}
                  response = requests.get(url, params=params, headers=headers, timeout=10)
                  if response.status_code != 200:
                      logger.warning(
                          f"ElevenLabs voices fetch failed with status {response.status_code}: {response.text}"
                      )
                      return []
                  data = response.json()
                  voices = data.get("voices", [])
                  return [
                      f"elevenlabs:{v['voice_id']}:{v['name']}"
                      for v in voices
                      if v.get("voice_id") and v.get("name") and v.get("status") != "disabled"
                  ]
              except Exception as e:
                  logger.warning(f"ElevenLabs voices fetch failed: {str(e)}")
                  return []
          '''
          new_voice = '''class ElevenLabsVoiceCatalogError(RuntimeError):
              """Raised when the ElevenLabs voice catalog cannot be loaded."""


          def get_elevenlabs_voices(
              api_key: str,
              *,
              raise_on_error: bool = False,
          ) -> list[str]:
              if not api_key:
                  message = "ElevenLabs API key is not configured"
                  if raise_on_error:
                      raise ElevenLabsVoiceCatalogError(message)
                  return []
              try:
                  url = "https://api.elevenlabs.io/v2/voices"
                  params = {"page_size": 100}
                  headers = {"xi-api-key": api_key}
                  response = requests.get(url, params=params, headers=headers, timeout=10)
                  if response.status_code != 200:
                      message = (
                          f"ElevenLabs voices request failed (HTTP {response.status_code}): "
                          f"{response.text}"
                      )
                      logger.warning(message)
                      if raise_on_error:
                          raise ElevenLabsVoiceCatalogError(message)
                      return []
                  data = response.json()
                  voices = data.get("voices", [])
                  return [
                      f"elevenlabs:{v['voice_id']}:{v['name']}"
                      for v in voices
                      if v.get("voice_id") and v.get("name") and v.get("status") != "disabled"
                  ]
              except ElevenLabsVoiceCatalogError:
                  raise
              except Exception as e:
                  message = f"ElevenLabs voices request failed: {str(e)}"
                  logger.warning(message)
                  if raise_on_error:
                      raise ElevenLabsVoiceCatalogError(message) from e
                  return []
          '''
          if old_voice not in voice_text:
              raise SystemExit("ElevenLabs voice function source block not found")
          voice_path.write_text(voice_text.replace(old_voice, new_voice, 1), encoding="utf-8")

          main_path = Path("webui/Main.py")
          main_text = main_path.read_text(encoding="utf-8")
          old_main = '''            elif selected_tts_server == "elevenlabs":
                          # 音色列表位于 Key 输入框之前渲染，必须先统一恢复重连状态并读取
                          # 配置/环境变量，否则页面会用空 Key 加载并缓存空音色列表。
                          saved_elevenlabs_api_key = _sync_elevenlabs_api_key_input()
                          cache_key = f"elevenlabs_voices_{saved_elevenlabs_api_key}"
                          if cache_key not in st.session_state:
                              st.session_state[cache_key] = voice.get_elevenlabs_voices(
                                  saved_elevenlabs_api_key
                              )
                          filtered_voices = st.session_state[cache_key]
          '''
          new_main = '''            elif selected_tts_server == "elevenlabs":
                          # 权限或网络错误不能永久缓存成空列表。否则用户在 ElevenLabs
                          # 后台修正 Key 权限后，同一 Streamlit session 仍会一直看到
                          # “No voices available” 且不会再次请求远端目录。
                          saved_elevenlabs_api_key = _sync_elevenlabs_api_key_input()
                          cache_key = f"elevenlabs_voices_{saved_elevenlabs_api_key}"
                          refresh_elevenlabs_voices = st.button(
                              tr("Refresh ElevenLabs Voices"),
                              key="refresh_elevenlabs_voices_button",
                              icon=":material/refresh:",
                              use_container_width=True,
                              disabled=not bool(saved_elevenlabs_api_key),
                          )
                          if refresh_elevenlabs_voices:
                              st.session_state.pop(cache_key, None)

                          if cache_key in st.session_state:
                              filtered_voices = st.session_state[cache_key]
                          elif saved_elevenlabs_api_key:
                              try:
                                  loaded_elevenlabs_voices = voice.get_elevenlabs_voices(
                                      saved_elevenlabs_api_key,
                                      raise_on_error=True,
                                  )
                              except voice.ElevenLabsVoiceCatalogError as exc:
                                  logger.warning(f"load ElevenLabs voices failed: {exc}")
                                  st.error(
                                      tr("ElevenLabs Voices Load Failed").format(
                                          error=str(exc)
                                      )
                                  )
                                  filtered_voices = []
                              else:
                                  filtered_voices = loaded_elevenlabs_voices
                                  if loaded_elevenlabs_voices:
                                      st.session_state[cache_key] = loaded_elevenlabs_voices
                                      if refresh_elevenlabs_voices:
                                          st.success(
                                              tr("ElevenLabs Voices Loaded").format(
                                                  count=len(loaded_elevenlabs_voices)
                                              )
                                          )
                                  else:
                                      st.warning(tr("ElevenLabs Voices Empty"))
                          else:
                              filtered_voices = []
          '''
          if old_main not in main_text:
              raise SystemExit("ElevenLabs WebUI source block not found")
          main_path.write_text(main_text.replace(old_main, new_main, 1), encoding="utf-8")

          replacements = {
              Path("webui/i18n/en.json"): [
                  (
                      '    "tts_provider_tips.elevenlabs": "Requires an [API key](https://elevenlabs.io/app/settings/api-keys). Default and account voices load automatically. Community [Voice Library](https://elevenlabs.io/app/voice-library) API access depends on your ElevenLabs plan.",',
                      '    "tts_provider_tips.elevenlabs": "Requires an [API key](https://elevenlabs.io/app/settings/api-keys). Account voices load automatically; legacy Default voices are only available to eligible accounts. Community [Voice Library](https://elevenlabs.io/app/voice-library) API access depends on your ElevenLabs plan.",\n    "Refresh ElevenLabs Voices": "Refresh ElevenLabs Voices",\n    "ElevenLabs Voices Load Failed": "Unable to load ElevenLabs voices: {error}",\n    "ElevenLabs Voices Loaded": "Loaded {count} ElevenLabs voices.",\n    "ElevenLabs Voices Empty": "ElevenLabs returned 0 voices for this account. Add a voice to My Voices, or check the account plan and voice permissions.",',
                  ),
              ],
              Path("webui/i18n/zh.json"): [
                  (
                      '    "tts_provider_tips.elevenlabs": "需要 [API Key](https://elevenlabs.io/app/settings/api-keys)；默认音色和账号已有音色会自动加载；社区 [Voice Library](https://elevenlabs.io/app/voice-library) 的 API 访问权限取决于 ElevenLabs 套餐。",',
                      '    "tts_provider_tips.elevenlabs": "需要 [API Key](https://elevenlabs.io/app/settings/api-keys)；账号已有音色会自动加载，旧版 Default 音色仅对符合条件的账号开放；社区 [Voice Library](https://elevenlabs.io/app/voice-library) 的 API 访问权限取决于 ElevenLabs 套餐。",\n    "Refresh ElevenLabs Voices": "重新加载 ElevenLabs 音色",\n    "ElevenLabs Voices Load Failed": "无法加载 ElevenLabs 音色：{error}",\n    "ElevenLabs Voices Loaded": "已加载 {count} 个 ElevenLabs 音色。",\n    "ElevenLabs Voices Empty": "ElevenLabs 为当前账号返回 0 个音色。请先将音色加入 My Voices，或检查账号套餐与音色权限。",',
                  ),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected i18n source block not found: {path}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/voice.py webui/Main.py webui/i18n/en.json webui/i18n/zh.json
          git commit -m "fix: refresh and diagnose ElevenLabs voices"
          git push origin HEAD:ui/six-clip-compact-sections
